[metadata]
name = retrieval-engineering-portfolio
version = 0.1.0
description = Offline graph search, retrieval evaluation, and synthetic transcript search demos
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
retrieval_portfolio = *.json, *.html

[options.entry_points]
console_scripts =
    retrieval-portfolio = retrieval_portfolio.server:main
